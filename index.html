<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e1d1d">
<title>Pulsars Studios</title>
<style>
:root{color-scheme:dark;--bg:#1e1d1d;--sf:#282726;--bd:#353433;--tx:#e6e5e3;--muted:#a3a2a0;--blue:#38a3ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(720px,100%);background:var(--sf);border:1px solid var(--bd);border-radius:24px;padding:clamp(28px,7vw,64px);text-align:center}.logo{width:64px;height:64px;border-radius:50%;margin:0 auto 24px;background:radial-gradient(circle at center,#fff 0 7%,var(--blue) 8% 28%,transparent 70%);filter:drop-shadow(0 0 20px #38a3ff66)}h1{font-size:clamp(34px,8vw,56px);line-height:1.1;letter-spacing:-.04em;margin:0 0 16px;font-weight:600}p{color:var(--muted);max-width:520px;margin:0 auto 28px}.tag{display:inline-block;border:1px solid var(--bd);border-radius:999px;padding:7px 14px;color:var(--muted);font-size:13px}footer{margin-top:32px;color:#81807e;font-size:13px}
</style>
</head>
<body><main class="card"><div class="logo" aria-hidden="true"></div><span class="tag">AI agent hub</span><h1>Pulsars Studios</h1><p>Ruang kerja untuk chat AI, agen, dan ide-ide yang ingin kamu wujudkan. Situs ini sudah tersedia untuk publik.</p><footer>© <span id="year"></span> Pulsars Studios</footer></main><script>document.getElementById('year').textContent=new Date().getFullYear()</script></body>
</html>
